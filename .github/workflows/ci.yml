name: CI

# 《守核 Corebound》回归保护网（质量门 R-1 遗留项「工程无 CI」落地）
#
# 覆盖：
#   1) 默认 headless 回归（切片 1–8 + T1 仇恨，九段汇总，退出码 0）
#   2) radial8 聚合闸门（geo8 / radial / geo8_smoke / geo8_golden / expo /
#      bulwark8 / panorama8 / attrition8，统一退出码 0）
#   3) 实机口径 MC（RADIAL + proto/elite ON）—— S5-D1 门禁 B 起飞率 ≥ 0.80
#   4) aggro_golive 退化逐位守护（第五刀 · 三轴合并镜像：
#      ①aggro OFF==proto ②proto OFF+aggro==真身 ③全 OFF==金标本 ④全开==真身
#      ⑤repair_on_disable=0 零扰动）
#   5) 实机**全开** MC + 口径矩阵（RADIAL + proto/elite/aggro 全 ON ·
#      repair_on_disable ∈ {0 OFF,1 FREE,2 PRICED}）—— 第五刀上线门禁
#      PRICED 多塔 B@6 起飞率 ≥ 0.80（口径补全后实测 0.850 ≥ 0.80 · 已转硬门禁）。
#   6) 反制窗口 M-1 上线门禁 MC（C-8 · RADIAL + proto/elite/aggro 全 ON ·
#      repair_on_disable ∈ {0 OFF,1 FREE,2 PRICED,9 REVIVE=M-1}）—— T-CP 上线门禁
#      REVIVE(9) 多塔 B@6 起飞率 ≥ 0.80（实测 0.840 ≥ 0.80）+ 自检 OFF B@6==203/300=0.677
#      （revive 接线零扰动）。🔴 仅纳入 C-8；C-9 保持独立诊断件，不进 CI。
#   7) 反制窗口 **实时版** MC（R-1 · 真身 WaveDirector · 产品开关 `combat_revive_enabled`）——
#      全 run（20 波 × shop AI）× 300 局 · 产品代码路径。守门 OFF B@6 == 203/300=0.677
#      （实时↔批处理零分岔）+ 主判 PRODUCT B@6 ≥ 0.80（实测 0.840）。脚本 quit(0/1) = 硬门禁。
#
# 🔴 口径红线的守门人：CI 只跑既有判据，**不新增、不下调任何阈值**。
#    任何一步非零退出 = 红（例如默认回归聚合读数漂移、radial8 任一项挂、MC 破线）。
#
# 🔴 硬门禁请按**步骤名**引用，勿按序号：插步会使序号整体偏移
#    （2026-10-13 音频两步插入使原 步1–7 → 步1–9）。

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.workbuddy/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.workbuddy/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 🔴 与本地开发一致（control-manifest §7）；升级需同步 project.godot 的 config_version 与全量回归。
  GODOT_VERSION: 4.7.2-stable

jobs:
  headless-regression:
    name: Headless 回归（默认 + radial8 + 实机口径 MC）
    runs-on: ubuntu-latest
    # 🔴 2026-10-12（用户批准 · T-CP-06）：30 → 45。纳入 C-8 步后 job 墙钟 ~33min
    #    （基线 run #4 = 25m11s + C-8 约 8~11min）> 30min → 上一步被超时卡断。
    #    🟢 纯墙钟上调：**不动任何阈值、不加 continue-on-error、不放宽门禁**。
    timeout-minutes: 45

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 缓存 Godot 可执行文件
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: 下载 Godot ${{ env.GODOT_VERSION }}（Linux）
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          echo "下载 $url"
          curl -fsSL -o /tmp/godot.zip "$url"
          unzip -oq /tmp/godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64"

      - name: 无头运行所需系统库
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64 \
            || sudo apt-get install -y -qq \
            libfontconfig1 libgl1 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2

      - name: 冒烟（二进制可运行）
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          "$GODOT" --headless --version

      - name: 导入资源（生成 .godot/ 缓存）
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p ci-logs
          "$GODOT" --headless --path . --import 2>&1 | tee ci-logs/import.log \
            || "$GODOT" --headless --path . --editor --quit 2>&1 | tee -a ci-logs/import.log

      # 🆕 2026-11-09 关卡实装：默认回归末尾追加 `world` 子进程组（地形 / 镜头导航 / 结构攻防 /
      #    建筑卡商店 / 准备阶段 / 卡面详情 / 关卡推进 共 11 个脚本，约 +20 s）。
      #    单独复跑：`-- world`；任一子脚本非零退出 = 本步红。
      - name: 默认回归（切片 1–8 + T1 仇恨 + 关卡实装 world）
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p ci-logs
          "$GODOT" --headless --path . --script res://tests/run_tests.gd 2>&1 | tee ci-logs/default.log
          echo "---- 九段汇总 ----"
          grep -E "汇总：通过|合计：PASS|world 结论" ci-logs/default.log || true

      # 🟢 T-P6-07 音频框架门禁（2026-10-13 team-lead 批准 · audio-verify G-6 盲区兜底）：
      #    G-6 事实：音频 id→路径 是**运行时映射**，打错 key = 运行时**静默 null**；
      #    而唯一含「资产存在性」断言的 run_audio_scene_check.gd 需真显示 → **进不了 CI**。
      #    两步均 **headless 可跑 · 无显示依赖** · 🔴 **禁 continue-on-error**（与既有硬门禁同口径）。
      #
      #    1) 免导入资产 lint —— 🔴 **关闭 G-6 的唯一有效手段**：逐条 FileAccess.file_exists
      #       校验 SFX_FILES/STEM_FILES 的路径（key→path 直接取自 audio_director.gd 常量，
      #       **无第二 SSOT**），缺失即 FAIL 并打印 `key → path`。
      #       🔴 不依赖 `--import`（走裸文件系统）→ 任何环境可跑。
      - name: 音频资产 lint（免导入 · key/路径兜底）
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p ci-logs
          "$GODOT" --headless --path . --script res://tests/lint_audio_assets.gd 2>&1 | tee ci-logs/audio_lint.log

      #    2) §7 音频框架回归断言 —— **额外回归网**（池 24+4 / 总线名 / 信号数 / 聚焦低通 /
      #       token 扫描）。🔴 口径如实：本步 **不含任何资产存在性检查**，**不**承担关闭
      #       G-6 的职责（那是上面第 1 步 lint 的事），勿混算。
      #    🔴 **勿加 `tests/run_audio_scene_check.gd`**：它需**真显示驱动 + 真音频设备**
      #       （跑 scenes/battle_shop.tscn 做端到端听觉路径验证），ubuntu headless CI 跑不了
      #       → 窗口验证只在本地/真机跑，**不属 CI 范围**。
      - name: 音频框架回归断言（§7 五条）
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p ci-logs
          "$GODOT" --headless --path . --script res://tests/run_audio_asserts.gd 2>&1 | tee ci-logs/audio_asserts.log

      - name: radial8 聚合闸门
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p ci-logs
          "$GODOT" --headless --path . --script res://tests/run_tests.gd -- radial8 2>&1 | tee ci-logs/radial8.log

      - name: aggro_golive 退化逐位守护（三轴合并镜像 · 第五刀）
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p ci-logs
          "$GODOT" --headless --path . --script res://tests/run_tests.gd -- aggro_golive 2>&1 | tee ci-logs/aggro_golive_guards.log

      - name: 实机口径 MC（proto/elite ON · B≥0.80 门禁）
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p ci-logs
          "$GODOT" --headless --path . --script res://tests/run_slice_proto_elite_mc.gd 2>&1 | tee ci-logs/proto_elite_mc.log

      # 🔴 第五刀上线门禁（2026-10-10 用户裁决「上线 + CI 转硬门禁」）：口径补全后
      #    PRICED 多塔 B@6 = 0.850 ≥ 0.80 达标（见 tower-aggro-golive-impl.md §7.4）→ 硬门禁（阻断）。
      - name: 实机全开 MC（proto/elite/aggro 全 ON · 第五刀 B≥0.80 门禁）
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p ci-logs
          "$GODOT" --headless --path . --script res://tests/run_slice_aggro_golive_mc.gd 2>&1 | tee ci-logs/aggro_golive_mc.log

      # 🔴 反制窗口 M-1 上线门禁（2026-10-12 用户裁决「仅纳入 C-8」· 硬门禁无 continue-on-error）：
      #    · 主判：REVIVE(9) 多塔 B@6 起飞率 ≥ 0.80（口径补全后实测 0.840 ≥ 0.80）
      #    · 自检：OFF(0) 臂 B@6 必须复现基线 203/300=0.677（M-1 接线零扰动证据）
      #    脚本 quit(0/1) 即门禁语义 → 任一破线 = 该步非零退出 = 红。
      #    🔴 C-9 保持独立诊断件（run_slice_aggro_golive_mc.gd 之外的玩家臂件），**不进** CI。
      - name: 反制窗口 M-1 上线门禁 MC（C-8 · REVIVE(9) B@6 ≥ 0.80）
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p ci-logs
          "$GODOT" --headless --path . --script res://tests/run_counterplay_mc.gd 2>&1 | tee ci-logs/counterplay_mc.log

      # 🔴 反制窗口**实时版** MC（R-1 · 2026-10-12 用户默认放行 · 硬门禁无 continue-on-error）：
      #    · 真身 `WaveDirector` 直读产品开关 `combat_revive_enabled`（= 产品实机路径）
      #    · 守门：OFF B@6 == 203/300（实时↔批处理零分岔）· 主判：PRODUCT B@6 ≥ 0.80（实测 0.840）
      #    脚本 quit(0/1) 即门禁语义 → 任一破线 = 该步非零退出 = 红。
      - name: 反制窗口 实时版 MC（R-1 · 产品开关 combat_revive_enabled · 硬门禁）
        run: |
          set -euo pipefail
          GODOT="$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p ci-logs
          "$GODOT" --headless --path . --script res://tests/run_realtime_counterplay_mc.gd 2>&1 | tee ci-logs/realtime_counterplay_mc.log

      - name: 上传日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_number }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14
